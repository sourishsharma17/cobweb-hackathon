<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Secure Dashboard</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: monospace;
      background: #fff;
      padding: 20px;
      line-height: 1.5;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    .header {
      border-bottom: 2px solid #000;
      padding-bottom: 10px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header h1 {
      font-size: 18px;
      font-weight: normal;
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn {
      background: #000;
      color: #fff;
      border: 2px solid #000;
      padding: 5px 10px;
      cursor: pointer;
      font-family: monospace;
      font-size: 14px;
    }

    .btn:hover {
      background: #fff;
      color: #000;
    }

    .btn-danger {
      background: #fff;
      color: #000;
    }

    .btn-danger:hover {
      background: #000;
      color: #fff;
    }

    .login-container {
      border: 2px solid #000;
      padding: 20px;
      max-width: 400px;
      margin: 50px auto;
    }

    .login-container h2 {
      margin-bottom: 20px;
      font-size: 18px;
      font-weight: normal;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      margin-bottom: 5px;
    }

    .form-group input,
    .form-group textarea {
      width: 100%;
      padding: 5px;
      border: 1px solid #000;
      font-family: monospace;
      font-size: 14px;
    }

    .form-group input:focus,
    .form-group textarea:focus {
      outline: 2px solid #000;
    }

    .alert {
      padding: 10px;
      margin-bottom: 15px;
      border: 1px solid #000;
    }

    .alert-error {
      background: #f0f0f0;
    }

    .dashboard {
      display: none;
    }

    .dashboard.active {
      display: block;
    }

    .actions {
      margin-bottom: 20px;
    }

    .items-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 15px;
    }

    .item-card {
      border: 1px solid #000;
      padding: 15px;
    }

    .item-card h3 {
      margin-bottom: 5px;
      font-size: 16px;
      font-weight: normal;
    }

    .item-card p {
      margin-bottom: 5px;
      font-size: 14px;
    }

    .item-value {
      font-size: 18px;
      margin: 10px 0;
    }

    .item-actions {
      display: flex;
      gap: 5px;
      margin-top: 10px;
    }

    .item-actions button {
      flex: 1;
    }

    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(255, 255, 255, 0.9);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }

    .modal.active {
      display: flex;
    }

    .modal-content {
      border: 2px solid #000;
      background: #fff;
      padding: 20px;
      max-width: 500px;
      width: 90%;
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      border-bottom: 1px solid #000;
      padding-bottom: 10px;
    }

    .modal-header h2 {
      font-size: 18px;
      font-weight: normal;
    }

    .close-btn {
      background: none;
      border: none;
      font-size: 20px;
      cursor: pointer;
    }

    .hidden {
      display: none;
    }

    .item-meta {
      font-size: 12px;
      margin-top: 5px;
    }
  </style>
</head>

<body>
  <!-- Login Screen -->
  <div id="loginScreen">
    <div class="login-container">
      <h2>Login</h2>
      <div id="loginError" class="alert alert-error hidden"></div>
      <form id="loginForm">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" required autocomplete="username">
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn" style="width: 100%;">Login</button>
      </form>
    </div>
  </div>

  <!-- Dashboard -->
  <div id="dashboardScreen" class="dashboard">
    <div class="container">
      <div class="header">
        <h1>Dashboard</h1>
        <div class="user-info">
          <span><strong id="currentUser"></strong></span>
          <button class="btn btn-danger" id="logoutBtn">Logout</button>
        </div>
      </div>

      <div class="actions">
        <button class="btn" id="addItemBtn">Add Item</button>
      </div>

      <div id="itemsContainer" class="items-grid">
        <!-- Items will be loaded here -->
      </div>
    </div>
  </div>

  <!-- Add/Edit Modal -->
  <div id="itemModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="modalTitle">Add New Item</h2>
        <button class="close-btn" id="closeModalBtn">&times;</button>
      </div>
      <div id="modalError" class="alert alert-error hidden"></div>
      <form id="itemForm">
        <input type="hidden" id="itemId">
        <div class="form-group">
          <label for="itemName">Name *</label>
          <input type="text" id="itemName" required maxlength="255">
        </div>
        <div class="form-group">
          <label for="itemDescription">Description</label>
          <textarea id="itemDescription" rows="4" maxlength="1000"></textarea>
        </div>
        <div class="form-group">
          <label for="itemValue">Value</label>
          <input type="number" id="itemValue" step="0.01" value="0">
        </div>
        <button type="submit" class="btn btn-success" style="width: 100%;">Save</button>
      </form>
    </div>
  </div>

  <script src="/app.js"></script>
</body>

</html>
